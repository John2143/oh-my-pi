name: Fork sync

# Keeps `john` a rebase of the fork's patches on top of `upstream/main`, gated by
# the repo's own typecheck and full test suite, then pushes it so the dotfiles
# flake input (`github:John2143/oh-my-pi/john`) can bump.
#
# Scheduled workflows only run from the default branch, which for this fork is
# `john`, so the workflow lives on `john` next to the patches (fork-patches.md).
#
# Runner: the self-hosted `github` VM (label `nixos`). Every step runs inside
# `nix develop .#default`, which is where bun, cargo, cargo-nextest and the
# native build dependencies come from. `--no-eval-cache` is deliberate: the VM
# collects garbage daily at 00:00 EST (05:00 UTC, 17 minutes before the cron
# below), which deletes the dev shell's derivations while the eval cache still
# points at them — `nix develop` then dies with "store path ... does not exist"
# instead of re-instantiating. Re-evaluating costs seconds; the cache costs the
# whole run.

on:
  schedule:
    # Daily, 17 minutes after the nix GC above (see the note at the top of env).
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Re-verify the current john tip even when upstream has not moved"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: fork-sync
  cancel-in-progress: false

env:
  # scripts/ci-test-ts.ts per-test ceiling, same value upstream CI uses.
  OMP_TEST_TIMEOUT: "120"
  # CI runs test chunks one at a time and stops at the first failure unless this
  # is set (scripts/ci-test-ts.ts: `pooled = ... (!isCI() || explicitConcurrency)`).
  # Pooled, every failing chunk is collected into one report. The 111-chunk
  # native/tooling/browser bucket dominates wall clock, so 16 slots halve it;
  # each chunk is one bun process (~1 GB, ~1 core), and the VM is 40 cores with
  # the org runners sharing it — do not go much past this.
  OMP_TEST_CONCURRENCY: "16"
  # Per-chunk watchdog (scripts/ci-test-ts.ts chunkTimeoutMs, default 600). The
  # Rust chunk is one pooled command that compiles the whole workspace before
  # nextest starts: ~10 min cold, because checkout's `git clean` drops target/.
  # 600 killed it at exit 137 mid-compile; this leaves room for compile plus run.
  OMP_TEST_CHUNK_TIMEOUT: "1800"
  UPSTREAM_REPO: https://github.com/can1357/oh-my-pi.git
  UPSTREAM_BRANCH: main
  # Upstream's CI workflow for `main`: the rebase targets the newest commit it
  # passed on (see the rebase step). Given as a file name, not an ID, so it
  # survives upstream recreating the workflow.
  UPSTREAM_CI_WORKFLOW: ci.yml
  FORK_BRANCH: john

jobs:
  sync:
    name: Rebase, verify, push
    # Only the fork's own runner: upstream's workflows use vmon labels, and this
    # one must never land on a runner that lacks the Nix toolchain.
    runs-on: [self-hosted, nixos]
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.FORK_BRANCH }}
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "omp fork sync"
          git config user.email "john@john2143.com"

      - name: Rebase onto upstream/main
        id: rebase
        shell: bash
        env:
          GH_API_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A self-hosted workspace keeps .git/config between runs, so the
          # remote from a previous job is still there: add or repoint, never fail.
          git remote get-url upstream >/dev/null 2>&1 || git remote add upstream "$UPSTREAM_REPO"
          git remote set-url upstream "$UPSTREAM_REPO"
          git fetch upstream "$UPSTREAM_BRANCH"
          TIP="upstream/$UPSTREAM_BRANCH"

          # Nothing to advance to: the tree was gated when it was pushed, so a
          # scheduled run stops and a forced dispatch re-verifies without a rebase.
          stop_or_verify() {
            if [ "${{ inputs.force }}" != "true" ]; then
              echo "changed=no" >> "$GITHUB_OUTPUT"
              echo "$1"
              exit 0
            fi
            echo "Forced: verifying the current tree without a rebase."
            echo "changed=yes" >> "$GITHUB_OUTPUT"
            exit 0
          }

          # Rebase onto upstream's newest *green* commit rather than its tip.
          # Upstream main is red for hours at a time — 5 of its 8 CI runs before
          # 2026-11-13 failed on their own lint, catalog or format churn — and a
          # rebase onto a red commit fails this gate over something the fork
          # cannot fix. When the tip is green this resolves to the tip, so the
          # fork still tracks upstream normally.
          SLUG=$(printf '%s' "$UPSTREAM_REPO" | sed -e 's#.*github\.com[:/]##' -e 's#\.git$##')
          URL="https://api.github.com/repos/$SLUG/actions/workflows/$UPSTREAM_CI_WORKFLOW/runs?branch=$UPSTREAM_BRANCH&status=success&event=push&per_page=1"
          # The runner shares one egress IP, where anonymous API calls hit the
          # hourly rate limit (403, seen on run 43335692146): present the job
          # token first and fall back to anonymous.
          RUNS=$(curl -fsS -H "Authorization: Bearer ${GH_API_TOKEN:-none}" -H "Accept: application/vnd.github+json" "$URL" 2>/dev/null \
            || curl -fsS -H "Accept: application/vnd.github+json" "$URL" 2>/dev/null || true)
          # `|| true`: no matching run makes grep exit 1, and `set -e` would
          # take that as a step failure instead of the "cannot confirm" path.
          GREEN=$(printf '%s' "$RUNS" | tr ',' '\n' | grep '"head_sha"' | head -1 | sed -e 's/.*"head_sha": *"//' -e 's/".*//' || true)
          if ! { printf '%s' "$GREEN" | grep -Eq '^[0-9a-f]{40}$' && git merge-base --is-ancestor "$GREEN" "$TIP"; }; then
            echo "::warning::No green CI run resolved for $SLUG — not advancing upstream this run."
            GREEN=""
          fi

          if [ -z "$GREEN" ]; then
            # Never advance onto a commit whose own CI we cannot confirm: stay on
            # the current (already gated) base and only re-check it.
            if git merge-base --is-ancestor "$TIP" HEAD; then
              stop_or_verify "Already current with $TIP."
            fi
            echo "Verifying the current tree; $TIP is $(git rev-list --count "HEAD..$TIP") commit(s) ahead but has no green run resolved."
            echo "changed=yes" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git merge-base --is-ancestor "$GREEN" HEAD; then
            stop_or_verify "Already current with the newest green upstream commit $GREEN."
          fi

          echo "Newest green upstream commit: $GREEN ($(git rev-list --count "HEAD..$GREEN") commit(s) ahead)."
          if ! git rebase "$GREEN"; then
            git rebase --abort
            git --no-pager log --oneline -1 "$GREEN"
            echo "changed=conflict" >> "$GITHUB_OUTPUT"
            echo "::error::Rebase conflict — a patch anchor moved. See fork-patches.md#replay-instructions."
            exit 1
          fi

          echo "changed=yes" >> "$GITHUB_OUTPUT"
          git --no-pager log --oneline "$GREEN"..HEAD

      - name: Cache bun installs
        if: steps.rebase.outputs.changed == 'yes'
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        if: steps.rebase.outputs.changed == 'yes'
        run: nix develop --no-eval-cache .#default -c bun install --frozen-lockfile

      - name: Typecheck
        if: steps.rebase.outputs.changed == 'yes'
        run: nix develop --no-eval-cache .#default -c bun run ci:check:full

      - name: Build native addons
        if: steps.rebase.outputs.changed == 'yes'
        run: nix develop --no-eval-cache .#default -c bun run build:native

      - name: Full test suite
        if: steps.rebase.outputs.changed == 'yes'
        shell: bash
        run: |
          set -euo pipefail
          # Upstream's agent-session-bash-session-ownership fixture drives a
          # `perl -e` child that publishes its pid, and this runner has no perl:
          # a hosted runner does, but neither the dev shell nor the service PATH
          # does, so the fixture never writes the pid file and two of its tests
          # fail here only (run 43338531530). Resolved from the flake's own
          # nixpkgs so the C++-less-shell path does not depend on the registry.
          PERL_BIN=$(nix build --no-link --print-out-paths --inputs-from . nixpkgs#perl \
            | grep -v -- '-man$' | head -1)/bin
          nix develop --no-eval-cache .#default -c bash -c "export PATH=$PERL_BIN:\$PATH; bun run test"

      - name: Push john
        if: steps.rebase.outputs.changed == 'yes'
        run: git push --force-with-lease origin HEAD:"$FORK_BRANCH"

      - name: Report failure
        # A conflict fails the rebase step, so `failure()` covers both a moved
        # patch anchor and a failed gate; the output only tailors the message.
        if: failure()
        uses: actions/github-script@v9
        env:
          NTFY_TOPIC_URL: ${{ secrets.NTFY_TOPIC_URL }}
        with:
          script: |
            const title = "fork-sync: john needs attention";
            const rebaseConflict = "${{ steps.rebase.outputs.changed }}" === "conflict";
            const what = rebaseConflict
              ? "rebasing `john` onto `upstream/main` hit a conflict."
              : "the rebase applied cleanly but verification failed, so `john` was not pushed.";
            const body = [
              `${what}`,
              "",
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              "",
              "Fix by hand with the replay instructions in `fork-patches.md`, then push `john`.",
            ].join("\n");
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const existing = open.find(issue => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
            if (process.env.NTFY_TOPIC_URL) {
              await fetch(process.env.NTFY_TOPIC_URL, {
                method: "POST",
                headers: { Title: "omp fork sync failed", Priority: "high", Tags: "rotating_light" },
                body: `${what}\n${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              });
            }
